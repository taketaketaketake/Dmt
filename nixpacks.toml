# Nixpacks build config for Railway — single-service deploy.
# Builds the Vite frontend and the Fastify server, then the server serves
# web/dist as static files (see server/src/index.ts). There is no root
# package.json, so every phase is declared explicitly here.

providers = ['node']

[phases.setup]
# openssl is required by Prisma's query engine at build and runtime.
nixPkgs = ['nodejs_22', 'openssl']

[phases.install]
# --include=dev forces devDependencies (typescript, vite, prisma CLI) to be
# installed even though NODE_ENV=production is set on the service, which npm
# would otherwise read as --omit=dev. They're needed to build and to run
# `prisma migrate deploy` at start.
cmds = [
  'npm --prefix server ci --include=dev',
  'npm --prefix web ci --include=dev',
]

[phases.build]
cmds = [
  'npm --prefix web run build',        # -> web/dist
  'npm --prefix server run db:generate', # prisma client
  'npm --prefix server run build',     # tsc -> server/dist
]

[start]
# Must run from the server dir: index.ts resolves the frontend via
# process.cwd()/../web/dist. migrate deploy applies pending migrations at
# boot, when DATABASE_URL is available. The needs seed is idempotent (upserts)
# and keeps the taxonomy + offerable skill flags in sync on every deploy.
cmd = 'cd server && npx prisma migrate deploy && npx tsx prisma/seed-needs.ts && npx tsx prisma/seed-categories.ts && node dist/index.js'
